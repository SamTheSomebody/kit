# Pull requests: tests, a compile of every component on the oldest Svelte the
# peer range allows, and a check of what each package would publish.
# publish.yml runs the same `npm run verify` before it versions or publishes.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 10 crashes installing this workspace fresh ("reading 'edgesOut'");
      # publish.yml installs npm 11 for trusted publishing, so match it.
      - run: npm install -g npm@^11.5.1
      - run: npm install
      - run: npm run verify
