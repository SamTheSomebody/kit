# Changesets on main:
#   - pending .changeset/* → Version Packages PR
#   - no pending changesets + unpublished versions → npm publish via OIDC
#
# npm security (2025–2027): classic tokens revoked; write tokens expire ≤90d;
# bypass-2FA tokens being removed. Prefer trusted publishing (OIDC) — no NPM_TOKEN.
#
# One-time npmjs.com setup (both packages):
#   Settings → Trusted Publisher → GitHub Actions
#     owner: SamTheSomebody
#     repo: kit
#     workflow: publish.yml
#     allowed actions: enable "npm publish" (stage-only breaks Changesets today)
# First successful publish must land within 2 days of creating the publisher.
#
# Repo settings: Actions → General → allow Actions to create/approve PRs.
name: publish

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Require npm for trusted publishing
        run: |
          # Trusted publishing needs npm ≥ 11.5.1 and Node ≥ 22.14
          node -e "const [a,b]=process.versions.node.split('.').map(Number); if(a<22||(a===22&&b<14)) process.exit(1)"
          npm install -g npm@^11.5.1
          npm --version

      - run: npm install

      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm install -g npm@^11.5.1
      - run: npm install

      - uses: changesets/action/version@v2

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          package-manager-cache: false

      - run: npm install -g npm@^11.5.1
      - run: npm install

      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@^11.5.1
      - run: npm install

      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
